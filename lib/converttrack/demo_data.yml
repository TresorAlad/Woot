  incoming:
    - "Bonjour, j aimerais des informations sur vos produits."
    - "Est-ce que vous livrez en province ?"
    - "Avez-vous ce modele en promotion ?"
    - "Je souhaite modifier ma commande."
    - "Pouvez-vous me rappeler demain matin ?"
  outgoing:
    - "Bonjour ! Je suis la pour vous aider."
    - "Merci pour votre message, je verifie et reviens vers vous."
    - "Voici les details demandes. N hesitez pas si vous avez d autres questions."
    - "Votre demande a ete transmise a l equipe concernee."
