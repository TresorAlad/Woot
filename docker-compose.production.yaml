x-woot-base: &woot-base
  image: woot:latest
  env_file: .env
  network_mode: host

x-converttrack-env: &converttrack-env
  CHATWOOT_BASE_URL: http://127.0.0.1:3000
  CONVERTTRACK_WEBHOOK_URL: http://127.0.0.1:5000/webhook/chatwoot
  CONVERTTRACK_WEBSITE_URL: http://127.0.0.1:5000/test

services:
  rails:
    <<: *woot-base
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RACK_TIMEOUT=15
    entrypoint: ["/app/docker/entrypoints/rails-neon.sh"]
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    volumes:
      - storage_data:/app/storage
      - ./config/database.yml:/app/config/database.yml:ro
      - ./docker/entrypoints/rails-neon.sh:/app/docker/entrypoints/rails-neon.sh:ro

  sidekiq:
    <<: *woot-base
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: ["/app/docker/entrypoints/rails-neon.sh"]
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    volumes:
      - storage_data:/app/storage
      - ./config/database.yml:/app/config/database.yml:ro
      - ./docker/entrypoints/rails-neon.sh:/app/docker/entrypoints/rails-neon.sh:ro

  converttrack:
    build:
      context: ./converttrack
      network: host
    env_file:
      - ./converttrack/.env
    environment:
      <<: *converttrack-env
    network_mode: host
    volumes:
      - converttrack_runtime:/shared
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["gunicorn", "-b", "127.0.0.1:5000", "--timeout", "120", "wsgi:app"]
    depends_on:
      - redis
    restart: always

  converttrack-setup:
    <<: *woot-base
    env_file:
      - .env
      - ./converttrack/.env
    environment:
      <<: *converttrack-env
    volumes:
      - ./config/database.yml:/app/config/database.yml:ro
      - ./docker/entrypoints/rails-neon.sh:/app/docker/entrypoints/rails-neon.sh:ro
      - ./converttrack/scripts:/app/converttrack/scripts:ro
      - converttrack_runtime:/shared
    entrypoint: ["/app/docker/entrypoints/rails-neon.sh"]
    command: ["bundle", "exec", "rails", "runner", "/app/converttrack/scripts/chatwoot_bootstrap.rb"]
    depends_on:
      - rails
      - converttrack
    restart: on-failure

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  redis_data:
  converttrack_runtime:
